<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/90a441_4d23b88c0ab3440d938b6f61b6dd045f~mv2.jpg/v1/fill/w_300,h_282,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/90a441_4d23b88c0ab3440d938b6f61b6dd045f~mv2.jpg">


    <style>


        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           background-repeat no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow-y: auto; 
           position: relative;
           margin: 0;
           padding: 0;
           font-family: 'VT323', monospace;
           color: #000000;
           text-align: center; 
           background-attachment: fixed;
        }

        .text-box {
            text-align: center;
            position: relative;
            font-family: 'Oswald' , monospace;
            top: 5%;
            left: 5%;
            color: #000000;
            max-width: 700px;
            transform: translateY(-50%); 
        }    
        
        h1 {
           text-align: center;
           font-size: 50px;
           white-space: nowrap;
           margin-top: 40px;

        }

        @keyframes blink {
             50% { border-color: transparent; }
        }

        .back-box {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #000000;
            font-family: 'Oswald' , sans-serif;
        }

        ul {
            margin: 10px 0 0 20px;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("pdr.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: top-left;
            z-index: -1;
        }   



    </style>


</head>


<body>


    <div 
    
    class="text-box">
         <h1>The Eddie Effect</h1>

    </div>

    <div
    
    class="back-box">
         <a href="index.html" class="nav-btn">Home</a>

    </div>

    <div class="bg"></div>


</body>


</html>
