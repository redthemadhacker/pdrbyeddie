<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <title>PDR by Eddie</title>
    <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/90a441_4d23b88c0ab3440d938b6f61b6dd045f~mv2.jpg/v1/fill/w_300,h_282,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/90a441_4d23b88c0ab3440d938b6f61b6dd045f~mv2.jpg">


    <style>
        

        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           background-repeat no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow-y: auto; 
           position: relative;
           margin: 0;
           padding: 0;
           font-family: 'VT323', monospace;
           color: #000000;
           text-align: center; 
           background-attachment: fixed;
        }

        .text-box {
            text-align: center;
            position: relative;
            font-family: 'VT323', monospace;
            top: 5%;
            left: 5%;
            color: #000000;
            max-width: 700px;
            transform: translateY(-50%); 
        }    
        
        h1 {
           text-align: center;
           font-size: 50px;
           white-space: nowrap;
           border-right: 3px solid #000000;
           margin-top: 40px;
           animation: typing 05s steps(20), blink 0.7s infinite;
        }
        @keyframes typing {
             from { width: 0; }
             to { width: 100%; }
        }

        @keyframes blink {
             50% { border-color: transparent; }
        }

        .back-box {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #000000;
            font-family: 'VT323', monospace;
        }

        .log-container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            margin-top: 100px;
        }

        .log-entry {
            opacity: 0;
            transform: translateY(40px);
            animation: flyIn 0.8s ease-out forwards;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #000000;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px #000000;
            text-align: center;
        }

        @keyframes flyIn {
            to {
            opacity: 1;
            transform: translateY(0);
            }
        }

        .log-entry:nth-child(1) { animation-delay: .5s; }
        .log-entry:nth-child(2) { animation-delay: 1s; }
        .log-entry:nth-child(3) { animation-delay: 1.5s; }
        .log-entry:nth-child(4) { animation-delay: 2s; }
        .log-entry:nth-child(5) { animation-delay: 2.5s; }
        .log-entry:nth-child(6) { animation-delay: 3s; }

        ul {
            margin: 10px 0 0 20px;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            z-index: -1;
        }   



    </style>


</head>


<body>


    <div 
    
    class="text-box">
         <h1>The Eddie Effect</h1>

    </div>

    <div
    
    class="back-box">
         <a href="index.html" class="nav-btn">Home</a>

    </div>

    <div class="bg"></div>


</body>


</html>
