<head>

    <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/90a441_4d23b88c0ab3440d938b6f61b6dd045f~mv2.jpg/v1/fill/w_300,h_282,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/90a441_4d23b88c0ab3440d938b6f61b6dd045f~mv2.jpg">


    <style>


        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           color: #000000;
           font-family: 'VT323', monospace; 
           background-repeat no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow-y: auto; 
           position: relative;
           margin: 0;
           padding: 0;
           text-align: center;
           background-attachment: fixed;
           /* (CONSTRUCTION) background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6-OMaAal5Ljp8agQJbkM7PBLJFOW_HFdcR8nH3-GvFA&s=10"); */
           background-image:  url("pdr.png");
        }  
        
        h1 {
           text-align: center;
           font-size: 50px;
           white-space: nowrap;
           border-right: 3px solid #000000;
           margin-top: 40px;
           animation: typing 05s steps(20), blink 0.7s infinite;
        }
        @keyframes typing {
             from { width: 0; }
             to { width: 100%; }
        }

        @keyframes blink {
             50% { border-color: transparent; }
        }

        .back-box {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #000000;
            font-family: 'VT323', monospace;
        }
  

        @keyframes flyInSide {
            to {
            opacity: 1;
            transform: translateX(0);
            }
        }

        .service-btn {
            border: 2px solid #000000;
            border-radius: 15px;
            padding: 5px;
            background-color: #000000;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: top-left;
            z-index: -1;
            background-image: url("pdr.png"); 
        }

        body {
        background: #0a0a0a;
        color: #ff0000;
        font-family: 'VT323', monospace;
        padding: 40px;
        text-align: center;
        }

        h1 {
            color: #ff0000;
            margin-bottom: 25px;
        }

        .form {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px; 
            background: #111;
            padding: 25px; 
            border-radius: 10px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .label {
            text-align: left;
            font-weight: 600;
            color: #ff0000;
            margin-top: 25px;
            margin-bottom: 6px; 
        }

        .form input,
        .form textarea {
            padding: 10px;
            border: 2px solid #ff0000;
            background-color: #0a0a0a;
            color: white;
            border-radius: 6px;
            font-size: 15px;
        }

        .button {
            padding: 12px;
            background: #ff0000;
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'VT323', monospace;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #ff3333;
        }

        .facebook-icon {
            width: 50px; 
            height: auto;
        }

        .phone-icon {
            width: 50px; 
            height: auto;
        }

        .instagram-icon {
            width: 65px; 
            height: auto;
        }

        .twitter-icon {
            width: 50px; 
            height: auto;
        }


        .pinterest-icon {
            width: 35px; 
            height: auto;
        }

        .page-wrapper {
            display: flex;
            align-items: center;
            gap: 0px; 
            flex-wrap: nowrap;
        }


    </style>


</head>


<body>

     <div 
    
    class="text-box">
         <h1>Repair Hotline</h1>

    </div>

  <form action="" method="POST">

  <div class="form">
    <div class="label">Name</div>
    <input type="text" name="name" required>
  </div>

  <div class="form">
    <div class="label">Email</div>
    <input type="email" name="email" required>
  </div>

  <div class="form">
    <div class="label">Request</div>
    <textarea name="message" required></textarea>
  </div>

  <button class="button">Done</button>
  </form>

  <div id="result"></div>
