<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">

    <style>


        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           color: #000000;
           font-family: 'Oswald', sans-serif; 
           background-repeat no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow: hidden;
           position: relative;
           margin: 0;
           padding: 0;
           text-align: center;
           background-attachment: fixed;
           /* (CONSTRUCTION) background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6-OMaAal5Ljp8agQJbkM7PBLJFOW_HFdcR8nH3-GvFA&s=10"); */
           background-image:  url("pdr.png");
        }  
        
        h1 {
           text-align: center;
           font-size: 50px;
           border-right: 3px solid #000000;
           margin-top: 40px;
        }


        .back-box {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #000000;
            font-family: 'VT323', monospace;
        }

        .service-btn {
            border: 2px solid #000000;
            border-radius: 15px;
            padding: 5px;
            background-color: #000000;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: top-left;
            z-index: -1;
            background-image: url("pdr.png"); 
        }

        body {
        background: #0a0a0a;
        color: #000000;
        font-family: 'VT323', monospace;
        padding: 40px;
        text-align: center;
        }

        form, .form {
            width: 90% !important;
            max-width: 450px !important;
            margin: 30px auto !important;
            background: #111111;
            padding: 25px; 
            border-radius: 10px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .form-group label {
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: left;
        }

        .form-group input,
        .form-group textarea {
            width: 100% !important;
            padding: 10px;
            border: 2px solid #ff0000;
            background-color: #ffffff !important; 
            color: #000000 !important;            
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #666666;
        }

        .form button,
        form button {
            width: 100%;
            background-color: #ff0000;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .button {
            padding: 12px;
            background: #ff0000;
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 0px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'VT323', monospace;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .button:hover {
            background: #ff3333;
        }

        .facebook-icon {
            width: 50px; 
            height: auto;
        }

        .phone-icon {
            width: 50px; 
            height: auto;
        }

         .text-icon {
            width: 50px; 
            height: auto;
        }

        .instagram-icon {
            width: 50px; 
            height: auto;
        }

        .twitter-icon {
            width: 50px; 
            height: auto;
        }


        .pinterest-icon {
            width: 40px; 
            height: auto;
        }

        .page-wrapper {
            display: flex;
            align-items: center;
            gap: 5px; 
            flex-wrap: nowrap;
            margin-top: 90px;
            margin-left: 42%;
        }


    </style>


</head>


<body>

     <div 
    
    class="text-box">
         <h1>Repair Hotline</h1>

    </div>

  <form class="form"  action="https://formspree.io/f/mvkoqqje" method="POST">

    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Jane Doe">
    </div>

    <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required placeholder="(555) 555-5555">
    </div>

    <div class="form-group">
        <label for="year">Vehicle Year:</label>
        <input type="number" id="year" name="year" required placeholder="2026">
    </div>

    <div class="form-group">
        <label for="make">Vehicle Make:</label>
        <input type="text" id="make" name="make" required placeholder="Toyota">
    </div>

    <div class="form-group">
        <label for="model">Vehicle Model:</label>
        <input type="text" id="model" name="model" required placeholder="Camry XSE">
    </div>

    <div class="form-group">
        <label for="message">Dent details:</label>
        <textarea id="message" name="message" rows="4" placeholder="Where is the dent located on the car?"></textarea>
    </div>

    <button type="submit">Submit Request</button>
    </form>

  <div id="result"></div>

    <div class="page-wrapper">

        <div class="image-map">
        
            <a href="tel:7068888625" class="spot spot-phone">
            
            <img
            
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcyK6My_K7xY6jrEHbdExcj_A7TTiU69wUMq5tTgHrRDJJPv3LlT3_mWM&s=10"
            
            alt="Phone"
            
            class="phone-icon">
            
            </a>
        
        </div>  

        <div class="image-map">
        
            <a href="sms:7068888625?body=Hi!%20Here%20is%20a%20photo%20of%20my%20dent:" class="spot spot-text">
            
            <img
            
            src="https://thumbs.dreamstime.com/b/text-message-phone-icon-flat-vector-illustration-design-text-message-phone-icon-flat-vector-illustration-design-isolated-white-158418276.jpg"
            
            alt="Text"
            
            class="text-icon">
            
            </a>
        
        </div>  

        <div class="image-map">
        
            <a href="https://www.facebook.com/PDRbyEddie/" target="_blank" rel="noopener noreferrer">

            src="https://img.magnific.com/premium-vector/vector-facebook-social-media-icon-illustration_534308-21672.jpg?semt=ais_hybrid&w=740&q=80"
            
            alt="Facebook"
            
            class="facebook-icon">
            
            </a>
        
        </div>

            src="https://img.magnific.com/free-vector/instagram-vector-social-media-icon-7-june-2021-bangkok-thailand_53876-136728.jpg?semt=ais_hybrid&w=740&q=80"
            
            alt="Instagram"
            
            class="instagram-icon">
            
            </a>
        
        </div>  

            <div class="image-map">
        
            <a href="https://www.twitter.com/PDRbyEddie" target="_blank" rel="noopener noreferrer">

        <div
    
        class="back-box">
